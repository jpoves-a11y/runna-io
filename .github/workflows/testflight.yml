name: TestFlight

# Builds, signs and uploads the app to App Store Connect (TestFlight). Run it by hand:
# Actions -> TestFlight -> Run workflow. Needs these repository secrets (see ios/README.md):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API key, Admin role), APPLE_TEAM_ID
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 26 is not installed on this runner"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      # Archive (unsigned), entitlements, export with cloud-managed signing, checks and upload:
      # see ios/ci/testflight.sh (shared with codemagic.yaml)
      - name: Archive, sign and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Each run gets a higher build number than the last (1000 + run number)
          BUILD_NUMBER=$((1000 + ${{ github.run_number }})) WORK_DIR="$RUNNER_TEMP/build" ios/ci/testflight.sh

      # Informational: the number of Apple Development certificates must stay the same from one run
      # to the next. Never fails the job.
      - name: List signing certificates
        if: always()
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          [ -f "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" ] || exit 0
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]==2.9.0"
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json, os, time, urllib.request
          import jwt
          key_id, issuer = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]
          key = open(f"{os.environ['RUNNER_TEMP']}/keys/AuthKey_{key_id}.p8").read()
          now = int(time.time())
          token = jwt.encode({"iss": issuer, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": key_id})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/certificates?limit=200",
                                       headers={"Authorization": f"Bearer {token}"})
          certs = json.load(urllib.request.urlopen(req))["data"]
          counts = {}
          for c in certs:
              a = c["attributes"]
              counts[a["certificateType"]] = counts.get(a["certificateType"], 0) + 1
              print(f'{a["certificateType"]:<24} {a.get("name", ""):<40} expires {a.get("expirationDate", "")[:10]}')
          print("Totals:", ", ".join(f"{k}={v}" for k, v in sorted(counts.items())))
          PY

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
