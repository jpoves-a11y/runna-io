name: iOS build

on:
  push:
    paths:
      - 'ios/**'
      - 'worker/**'
      - 'shared/**'
      - 'scripts/e2e/**'
      - '.github/scripts/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app (unsigned)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for simulator (Debug)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Runna.xcodeproj \
            -scheme Runna \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build > build-debug.log 2>&1 || { grep -E "error:" build-debug.log | sort -u; tail -50 build-debug.log; exit 1; }
          echo "Swift files compiled: $(grep -cE '^SwiftCompile .*\.swift' build-debug.log || true)"
          echo "--- warnings ---"
          grep -E "warning:" build-debug.log | grep -v "^ld: warning" | sort -u | head -100 || true
          echo "--- app bundle ---"
          ls -la build/DerivedData/Build/Products/Debug-iphonesimulator/Runna.app

      - name: Check Info.plist
        working-directory: ios
        run: |
          PLIST=build/DerivedData/Build/Products/Debug-iphonesimulator/Runna.app/Info.plist
          plutil -p "$PLIST"
          for key in NSLocationWhenInUseUsageDescription NSHealthShareUsageDescription NSCameraUsageDescription UIBackgroundModes CFBundleURLTypes CFBundleDisplayName; do
            plutil -extract "$key" raw "$PLIST" > /dev/null 2>&1 || plutil -extract "$key" xml1 -o - "$PLIST" > /dev/null || { echo "Missing $key"; exit 1; }
          done

      - name: Launch in simulator (smoke test)
        working-directory: ios
        run: |
          set -e
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, items in sorted(devices.items(), reverse=True) if 'iOS' in runtime for d in items if d['name'].startswith('iPhone')))
          ")
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/DerivedData/Build/Products/Debug-iphonesimulator/Runna.app
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw build/DerivedData/Build/Products/Debug-iphonesimulator/Runna.app/Info.plist)
          xcrun simctl launch "$DEVICE" "$BUNDLE_ID"
          sleep 20
          xcrun simctl io "$DEVICE" screenshot screenshot-launch.png
          if xcrun simctl spawn "$DEVICE" launchctl list | grep -q "$BUNDLE_ID"; then
            echo "App is still running after 20 s"
          else
            echo "App is not running (crashed?)"
            ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i runna || true
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start local API with seeded test data
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          (cd worker && npm ci --no-audit --no-fund)
          mkdir -p scripts/e2e/.build
          npx esbuild worker/src/index.ts --bundle --format=esm --platform=node --target=node20 \
            --outfile=scripts/e2e/.build/worker.mjs --alias:@libsql/client/web=@libsql/client --external:@libsql/client --log-level=warning
          DATABASE_URL=file:scripts/e2e/.build/e2e.db npx drizzle-kit push --force
          nohup node scripts/e2e/server.mjs > scripts/e2e/.build/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/api/health > /dev/null && break; sleep 1; done
          node scripts/e2e/seed.mjs > scripts/e2e/.build/session.json

      - name: Screens with test data
        working-directory: ios
        run: |
          set -e
          APP=build/DerivedData/Build/Products/Debug-iphonesimulator/Runna.app
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          DEVICE=$(xcrun simctl list devices booted -j | python3 -c "import json,sys; print(next(d['udid'] for v in json.load(sys.stdin)['devices'].values() for d in v))")
          # The test API is plain http on localhost (test copy of the app only)
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$APP/Info.plist"
          xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" || true
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl privacy "$DEVICE" grant location "$BUNDLE_ID" || true
          xcrun simctl location "$DEVICE" set 41.6488,-0.8891 || true
          export SIMCTL_CHILD_RUNNA_API_BASE_URL=http://127.0.0.1:8787
          export SIMCTL_CHILD_RUNNA_TEST_TOKEN=$(python3 -c "import json; print(json.load(open('../scripts/e2e/.build/session.json'))['token'])")
          export SIMCTL_CHILD_RUNNA_TEST_USER_ID=$(python3 -c "import json; print(json.load(open('../scripts/e2e/.build/session.json'))['userId'])")
          xcrun simctl launch "$DEVICE" "$BUNDLE_ID"
          sleep 20
          xcrun simctl io "$DEVICE" screenshot screenshot-1-map.png
          # Relaunch on each screen (simctl openurl would show an "Open in app?" prompt)
          shoot() {
            xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" || true
            SIMCTL_CHILD_RUNNA_TEST_DEEP_LINK="runnaio://$1" xcrun simctl launch "$DEVICE" "$BUNDLE_ID"
            sleep 12
            xcrun simctl io "$DEVICE" screenshot "screenshot-$2.png"
          }
          shoot tab/rankings 2-rankings
          shoot tab/activity/feed 3-feed
          shoot tab/activity/mine 4-my-runs
          shoot tab/friends 5-friends
          shoot tab/profile 6-profile
          if ! xcrun simctl spawn "$DEVICE" launchctl list | grep -q "$BUNDLE_ID"; then
            echo "App crashed while showing the screens"
            exit 1
          fi
          echo "API requests made by the app: $(grep -c -- '<-- GET /api' ../scripts/e2e/.build/server.log || true)"

      - name: Inspect screenshots and API log
        if: always()
        working-directory: ios
        run: |
          echo "--- API responses that weren't 200 ---"
          grep -- '-->' ../scripts/e2e/.build/server.log | sed 's/\x1b\[[0-9;]*m//g' | grep -vE ' 200 ' | head -40 || true
          echo "--- API errors ---"
          grep -iE 'error|failed' ../scripts/e2e/.build/server.log | grep -viE 'email|resend|network disabled' | head -20 || true
          for f in screenshot-*.png; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            swift ../.github/scripts/inspect-screenshot.swift "$f" || true
          done

      - name: Upload screenshots and API log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: |
            ios/screenshot-*.png
            scripts/e2e/.build/server.log
          if-no-files-found: ignore

      - name: Build for device (Release, unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Runna.xcodeproj \
            -scheme Runna \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build > build-release.log 2>&1 || { grep -E "error:" build-release.log | sort -u; tail -50 build-release.log; exit 1; }
          echo "Release build succeeded"
          grep -E "warning:" build-release.log | grep -v "^ld: warning" | sort -u | head -50 || true
