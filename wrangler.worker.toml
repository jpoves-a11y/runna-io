# ===========================================
# CONFIGURACIÓN DE CLOUDFLARE WORKER (Backend API)
# ===========================================
# Este archivo configura tu backend API para Cloudflare Workers
# Usa: cd worker && npm install && cd .. && wrangler deploy -c wrangler.worker.toml

name = "runna-io-api"
account_id = "5b173ee18f2de458cbc95ab4a55ab8ba"
main = "worker/src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Smart Placement: Cloudflare runs the Worker close to the database (Turso) instead of close to
# the user, so the several queries of each request don't each cross an ocean.
[placement]
mode = "smart"

# Variables de entorno (NO secretas)
# Keep variables added in the Cloudflare dashboard when deploying from GitHub
# (without this, `wrangler deploy` removes dashboard variables of type Text; Secrets are always kept)
keep_vars = true

[vars]
ENVIRONMENT = "production"
# Emails (verification codes, "forgot password", friend requests...) go out through this Gmail
# account's SMTP server, free and without an own domain. Needs the secret GMAIL_APP_PASSWORD:
# an app password of that Google account (README → "Emails").
EMAIL_PROVIDER = "gmail"
GMAIL_USER = "runna.io.service@gmail.com"
SENDGRID_FROM = "runna.io.service@gmail.com"
RESEND_FROM = "onboarding@resend.dev"

# NOTA: Las API keys deben configurarse como secretos:
# wrangler secret put GMAIL_APP_PASSWORD -c wrangler.worker.toml
# wrangler secret put SENDGRID_API_KEY -c wrangler.worker.toml
# wrangler secret put RESEND_API_KEY -c wrangler.worker.toml
# wrangler secret put DATABASE_URL -c wrangler.worker.toml
# wrangler secret put TURSO_AUTH_TOKEN -c wrangler.worker.toml
# wrangler secret put UPSTASH_CRON_SECRET -c wrangler.worker.toml
#
# ===== Push notifications (iOS app) =====
# Without these four secrets NO iPhone receives notifications (GET /api/push/status shows it):
# wrangler secret put APNS_KEY_ID -c wrangler.worker.toml       # Key ID of the .p8 APNs key
# wrangler secret put APNS_TEAM_ID -c wrangler.worker.toml      # Apple Developer Team ID
# wrangler secret put APNS_PRIVATE_KEY -c wrangler.worker.toml  # full contents of AuthKey_XXXX.p8
# wrangler secret put APNS_BUNDLE_ID -c wrangler.worker.toml    # com.jpoves.runnaio
#
# ===== Polar instant sync (webhook) =====
# 1. curl -X POST -H "Authorization: Bearer $UPSTASH_CRON_SECRET" <worker>/api/admin/polar/webhook/register
# 2. wrangler secret put POLAR_WEBHOOK_SECRET -c wrangler.worker.toml   # signatureSecretKey from step 1
# The 5-minute cron poll keeps running as a fallback.
#
# ===== Scheduled tasks =====
# A single Cloudflare Cron Trigger (every 5 minutes) runs every task in-process, without HTTP
# (see worker/src/cron.ts, times in Europe/Madrid):
#   - polar-auto-sync: every run (fallback poll; the Polar webhook imports at once)
#   - spawn-treasure: minute 0 of every hour (the task picks today's random spawn hour)
#   - inactivity-check: 10:00 and 19:00
#   - weekly-summary: Sundays 20:00
#   - suunto-auto-sync: minute 30 of every hour (fallback poll; the Suunto webhook imports at once)
# Upstash/QStash schedules are no longer needed (delete them). The /api/tasks/* endpoints still
# accept "Authorization: Bearer <UPSTASH_CRON_SECRET>" or a QStash signature for manual runs.
#
# Optional vars:
#   WORKER_URL       public URL of this Worker (invite links, email buttons); default: request origin
#   APP_DOWNLOAD_URL App Store / TestFlight link shown on the /invite and /open landing pages
#
# Public pages served by the Worker: /privacy, /terms, /support, /invite/<token>, /open

[triggers]
crons = ["*/5 * * * *"]

# ===== Cloudflare Queue for Async Territory Processing =====
# The territory queue offloads CPU-heavy work (polygon intersections, stealing,
# feed metadata, notifications) from the HTTP request into a queue consumer
# that gets its own 30s CPU budget per message.
#
# Create the queue first:
#   npx wrangler queues create territory-processing
#   npx wrangler queues create territory-dlq

[[queues.producers]]
  binding = "TERRITORY_QUEUE"
  queue = "territory-processing"

[[queues.consumers]]
  queue = "territory-processing"
  max_batch_size = 1
  max_retries = 2
  dead_letter_queue = "territory-dlq"

# Para desplegar el Worker:
# 1. cd worker && npm install && cd ..
# 2. wrangler deploy -c wrangler.worker.toml
